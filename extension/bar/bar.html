<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="../lib/theme.css" />
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body data-color="purple">
    <main class="bar" role="dialog" aria-label="Command bar">
      <div class="field">
        <span id="lead" class="lead"></span>
        <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus placeholder="Search or enter a link" aria-label="Search or enter a link" aria-controls="results" />
      </div>
      <div id="results" class="results" role="listbox"></div>
    </main>
    <script type="module" src="bar.js"></script>
  </body>
</html>
